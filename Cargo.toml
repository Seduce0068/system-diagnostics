[package]
name = "system-diag-tool"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1.0"
socket2 = "0.5"
pnet = "0.35"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
clap = { version = "4.0", features = ["derive"] }
tokio = { version = "1.30", features = ["full"] }
libc = "0.2"
thiserror = "2.0.18"
